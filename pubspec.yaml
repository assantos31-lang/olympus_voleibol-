name: olympus_voleibol
description: Aplicativo Olympus Voleibol - Gestão de atletas e sócios
publish_to: 'none'

version: 2.0.2+11

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.6
  geolocator: ^13.0.1
  supabase_flutter: ^2.3.4
  provider: ^6.1.1
  image_picker: ^1.0.7
  cached_network_image: ^3.3.1
  google_fonts: ^6.1.0
  intl: ^0.20.2
  http: ^1.1.0
  flutter_masked_text2: ^0.9.1
  firebase_core: ^4.5.0
  firebase_messaging: ^16.1.2
  flutter_secure_storage: ^9.2.2
  uuid: ^4.5.1
  package_info_plus: ^8.0.2
  app_badge_plus: ^1.2.7
  pdf: ^3.11.0
  printing: ^5.13.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^3.0.2
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/olympus_logo_icon.png"
  remove_alpha_ios: true
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/olympus_logo_icon.png"

flutter_native_splash:
  color: "#000000"
  image: "assets/images/monte_olimpo_v2.png"
  android: true
  ios: true
  web: false
  fullscreen: true

flutter:
  uses-material-design: true

  assets:
    - assets/images/olympus_logo.png
    - assets/images/olympus_logo_icon.png
    - assets/images/monte_olimpo_v2.png
