name: olympus_voleibol
description: "Aplicativo Olympus Voleibol - Gestão de atletas e sócios"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  geolocator: ^13.0.1
  flutter:
    sdk: flutter
  flutter_localizations:      # ← Adicionado: suporte a localização (DatePicker em português)
    sdk: flutter

  cupertino_icons: ^1.0.6
  supabase_flutter: ^2.3.4
  provider: ^6.1.1
  image_picker: ^1.0.7
  cached_network_image: ^3.3.1
  google_fonts: ^6.1.0
  intl: ^0.19.0
  http: ^1.1.0
  flutter_masked_text2: ^0.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/olympus_logo.png