name: olympus_voleibol
description: Aplicativo Olympus Voleibol - Gestão de atletas e sócios
publish_to: 'none'

version: 4.2.0+03

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.6
  geolocator: ^13.0.1
  supabase_flutter: ^2.3.4
  provider: ^6.1.1
  shared_preferences: ^2.3.3
  image_picker: ^1.0.7
  video_compress: ^3.1.4
  video_player: ^2.11.1
  olympus_video_sticker:
    path: plugins/olympus_video_sticker
  cached_network_image: ^3.3.1
  image: ^4.8.0
  google_fonts: ^6.1.0
  intl: ^0.20.2
  http: ^1.1.0
  flutter_masked_text2: ^0.9.1
  firebase_core: ^4.5.0
  firebase_messaging: ^16.1.2
  flutter_secure_storage: ^9.2.4
  uuid: ^4.5.1
  package_info_plus: ^8.0.2
  app_badge_plus: ^1.2.7
  pdf: ^3.11.0
  printing: ^5.13.4
  flutter_local_notifications: ^17.2.4
  timezone: ^0.9.4
  url_launcher: ^6.3.1
  record: ^6.2.1
  audioplayers: ^6.7.1
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^3.0.2
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/olympus_logo_icon.png"
  remove_alpha_ios: true
  min_sdk_android: 23
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/olympus_logo_icon.png"

flutter_native_splash:
  color: "#000000"
  image: "assets/images/monte_olimpo_v2.png"
  android: true
  ios: true
  web: false
  fullscreen: true

flutter:
  uses-material-design: true

  assets:
    - assets/images/olympus_logo.png
    - assets/images/olympus_logo_icon.png
    - assets/images/monte_olimpo_v2.png
    - assets/stickers/
