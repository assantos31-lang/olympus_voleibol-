name: olympus_voleibol
description: Aplicativo Olympus Voleibol - Gestão de atletas e sócios
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.6
  geolocator: ^13.0.1
  supabase_flutter: ^2.3.4
  provider: ^6.1.1
  image_picker: ^1.0.7
  cached_network_image: ^3.3.1
  google_fonts: ^6.1.0
  intl: ^0.20.2
  http: ^1.1.0
  flutter_masked_text2: ^0.9.1
  firebase_core: ^4.5.0
  firebase_messaging: ^16.1.2
  flutter_local_notifications: ^17.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.2
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/olympus_logo.png
  adaptive_icon_background: "#0C2340"
  adaptive_icon_foreground: assets/images/olympus_logo.png
  remove_alpha_ios: true

flutter_native_splash:
  color: "#ffffff"
  image: assets/images/olympus_logo.png
  android: true
  ios: true
  web: false

flutter:
  uses-material-design: true

  assets:
    - assets/images/olympus_logo.png
    - assets/images/monte_olimpo.png
