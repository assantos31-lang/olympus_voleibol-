<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Olympus Voleibol - plataforma de gestão, treino e evolução de atletas.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <meta name="theme-color" content="#1E3A5F">
  <meta name="color-scheme" content="light">

  <meta property="og:title" content="Olympus Voleibol">
  <meta property="og:description" content="Gestão, treino, avaliações e evolução de atletas de voleibol.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="icons/Icon-512.png">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Olympus">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="512x512" href="icons/Icon-512.png">

  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">

  <title>Olympus Voleibol</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #1E3A5F;
    }

    body {
      overscroll-behavior: none;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
    }

    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(circle at top, rgba(212,175,55,0.28), transparent 36%),
        linear-gradient(180deg, #1E3A5F 0%, #102845 100%);
      color: white;
      font-family: Arial, Helvetica, sans-serif;
      z-index: 9999;
    }

    .loader-card {
      text-align: center;
    }

    .loader-logo {
      width: 78px;
      height: 78px;
      border-radius: 22px;
      margin: 0 auto 16px;
      background: linear-gradient(135deg, #F8E08E, #D4AF37);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #1E3A5F;
      font-size: 34px;
      font-weight: 900;
      box-shadow: 0 14px 32px rgba(0,0,0,0.28);
    }

    .loader-title {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 0.3px;
    }

    .loader-subtitle {
      margin-top: 8px;
      font-size: 13px;
      opacity: 0.75;
    }
  </style>
</head>

<body>
  <div id="loading">
    <div class="loader-card">
      <div class="loader-logo">O</div>
      <div class="loader-title">Olympus Voleibol</div>
      <div class="loader-subtitle">Carregando sua experiência...</div>
    </div>
  </div>

  <script>
    window.addEventListener('flutter-first-frame', function () {
      var loading = document.getElementById('loading');
      if (loading) {
        loading.style.display = 'none';
      }
    });
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
